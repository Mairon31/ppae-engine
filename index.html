<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPAE Studio — Fase 1: Núcleo Gráfico Procedural</title>
    <style>
      :root {
        --bg: #0f141c;
        --panel: #18202c;
        --border: #2a364a;
        --text: #e2e8f0;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        color: var(--accent);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      input,
      select,
      button {
        background: #0f141c;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px;
        border-radius: 4px;
        font-family: inherit;
      }
      button {
        cursor: pointer;
        background: #1e293b;
        font-weight: 600;
      }
      button:hover {
        border-color: var(--accent);
      }
      main {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      .asset-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 1px solid var(--border);
      }
      .meta {
        font-size: 11px;
        color: #94a3b8;
        width: 100%;
        line-height: 1.5;
      }
      .telemetry-box {
        background: #0b0f17;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>PPAE Phase 1 — Inspector</h1>
      <label>
        Semilla del Mundo (Seed)
        <input id="seed-input" type="text" value="PixelProject-2026" />
      </label>
      <label>
        Perfil de Granularidad (4x4 vs 6x6)
        <select id="profile-select">
          <option value="micro-4x4">Micro Art 4×4 (6×6 mod/tile)</option>
          <option value="micro-6x6">Micro Art 6×6 (4×4 mod/tile)</option>
          <option value="hybrid-24">Hybrid HD 48px</option>
        </select>
      </label>
      <label>
        Paleta / Bioma
        <select id="palette-select">
          <option value="meadow-summer">Pradera Templada (Verano)</option>
          <option value="meadow-autumn">Bosque Ámbar (Otoño)</option>
          <option value="tundra-winter">Tundra Boreal (Invierno)</option>
        </select>
      </label>
      <label>
        Estado del Recurso
        <select id="state-select">
          <option value="intact">Intacto</option>
          <option value="snowy">Nevado</option>
          <option value="wind_sway">Impulso de Viento</option>
          <option value="damaged">Dañado</option>
        </select>
      </label>
      <label>
        Escala Entera (Integer Zoom)
        <select id="scale-select">
          <option value="2">2× (Nativo x2)</option>
          <option value="4" selected>4× (Inspección)</option>
          <option value="6">6× (Macro Pixel)</option>
        </select>
      </label>
      <label style="flex-direction: row; align-items: center; gap: 8px">
        <input id="debug-pivots" type="checkbox" checked />
        Mostrar Pivote, Retícula y Hitbox
      </label>
      <button id="random-seed-btn">Generar Nueva Semilla</button>
      <div id="telemetry" class="telemetry-box"></div>
    </aside>
    <main>
      <section>
        <h2 style="margin: 0 0 10px 0; font-size: 14px">
          Escenario Ordenado por Profundidad (Y-Sorting + Retícula Lógica 16×16 → Visual 24×24)
        </h2>
        <canvas id="world-stage" width="768" height="320"></canvas>
      </section>
      <section>
        <h2 style="margin: 0 0 10px 0; font-size: 14px">Catálogo de Recursos Generados por Código</h2>
        <div id="cards-container" class="cards-grid"></div>
      </section>
    </main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
