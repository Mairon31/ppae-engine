name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - master
      - feat/ppae-2-art-overhaul
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo

  deploy:
    # The playground may deploy from its existing PR branch when github-pages allows it.
    # The environment's branch policies remain authoritative; no branch or PR merge required.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/ppae-2-art-overhaul'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke verification
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Playground HTML and asset MIME types
        run: node scripts/verify-live-pages.mjs
