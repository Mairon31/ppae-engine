name: PPAE 2.0 validation

on:
  push:
    branches:
      - feat/ppae-2-art-overhaul
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all tests
        run: npm test
      - name: Build library, declarations, and demo
        run: npm run build
